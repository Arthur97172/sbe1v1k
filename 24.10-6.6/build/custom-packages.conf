# 24.10-6.6 第三方应用开关清单（文件 B）
#
# 用法：
#   - 行首不加 #  = 启用该行列出的包（会写进 .config 并参与编译）
#   - 行首加 #    = 关闭该行列出的包（会写成 "# CONFIG_PACKAGE_x is not set"）
#   - 没有被本文件提到的包，行为不变（由 config-seed 与源码包内 .config 决定）
#
# 规则：
#   1. 文件里的 CUSTOM_PACKAGES="..." 语法只是给人和编辑器看的载体，
#      实际由 scripts/custom-packages.sh 逐词解析，按空白切分。
#   2. 这里只放**应用层**开关。依赖库（coreutils、ruby、libtirpc、xray-core、
#      sing-box、mihomo-meta 等）留在 config-seed，由 defconfig 自行解析；
#      因此关闭某个应用**不会**自动移除它的依赖库。
#   3. passwall 的 INCLUDE_* 子选项无法用这套语法表达，仍留在 config-seed。
#   4. 启用一个源码包中不存在的包名时，构建会在 "Apply custom packages" 步骤直接
#      失败并指名，不会静默出一个少包的镜像。
#   5. 新增第三方应用 = 先在文件 A（build/thirdparty-feeds.conf）登记源并补
#      sources/PROVENANCE.md 与许可证审查，再在这里打开。
#
# 本文件当前内容与 2026-10-23 本地构建的产物一致（七个应用）。

# ---------------------------------------------------------------------------
# 已启用：当前固件包含的七个第三方应用
# ---------------------------------------------------------------------------
CUSTOM_PACKAGES=""

# PassWall 代理面板
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-passwall"

# Nikki 代理面板（mihomo-meta 内核由 config-seed 提供）
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-nikki"

# OpenClash 代理面板（不捆绑内核，运行时由 Web 界面下载）
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-openclash"

# 关机 / 重启按钮
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-poweroffdevice"

# CPU 状态
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-cpu-status"

# 无线历史记录
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-wifihistory"

# Bandix-plus 流量监控（后端 bandix-plus 由 config-seed 提供）
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-bandix-plus"

# 动态 DNS（随上游 luci 提供，非第三方源）
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-ddns luci-i18n-ddns-zh-cn"

# 在线升级
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-online-upgrade luci-i18n-online-upgrade-zh-cn"

# ---------------------------------------------------------------------------
# 未启用：按需取消注释即可。启用前请先确认文件 A 已登记对应源，
# 并补 sources/PROVENANCE.md 与许可证记录（LICENSE_REVIEW_REQUIRED）。
#
# 注意：本区列出的包当前都没有进入固件；一旦取消注释就会**启用**它。
# 反过来，把启用区的某行注释掉 = 关闭该包。文件 B 是应用层开关的唯一依据。
# ---------------------------------------------------------------------------

