# 24.10-6.6 第三方源清单（文件 A）
#
# 作用：登记每个第三方组件的**出处与固定提交**，供
#   scripts/thirdparty-feeds.sh check   校验（不改动任何文件）
#   scripts/thirdparty-feeds.sh fetch   按固定提交补齐/校正源码树（只处理 mode=git）
# 使用。
#
# 重要：本文件**不**改写 sources/buildroot/feeds.conf。feeds.conf 里的
# src-link 指向 sources/thirdparty-feed 与 sources/passwall-selected，而
# thirdparty-feed 里全是相对软链。脚本只维护 vendor 目录和这些相对软链，
# 不生成绝对路径，因此 CI 上的 prepare-tree.sh 不需要额外处理。
# 也**不要**跑 scripts/feeds update —— 它会重建 feeds/ 与 .tmp，产生新的
# 绝对路径（sources/README.md 明确禁止）。
#
# 语法（每行一个记录，# 开头为注释）：
#
#   repo  <key> <url> <branch> <commit> <vendor-dir> <mode>
#        key        本文件内唯一的名字，供 link 行引用
#        branch     仅供人看；脚本以 commit 为准（未知时写 -）
#        vendor-dir 相对 sources/ 的目录
#        mode       git       干净单仓库，可自动 fetch/checkout
#                   manual    派生或人工剪裁，脚本只校验 HEAD，不自动改写
#
#   link  <feed-name> <repo-key> <subdir>
#        在 sources/thirdparty-feed/<feed-name> 建立指向
#        ../<vendor-dir>/<subdir> 的相对软链（subdir 为 . 表示仓库根）
#
#   local <feed-name> <path>
#        在 sources/thirdparty-feed/<feed-name> 建立指向 ../<path> 的相对软链
#        （用于人工重排过的本地目录；脚本只校验存在）
#
# 升级流程见 24.10-6.6/README.md。注意：CI 编译用的是 sources-v1 Release 里的
# 源码包，本地改完本文件后必须重新导出并上传源码包，CI 才会看到新版本。

# ---------------------------------------------------------------------------
# 仓库
# ---------------------------------------------------------------------------
repo passwall          https://github.com/Openwrt-Passwall/openwrt-passwall.git          - 0b14995d2375083ee2ff489a839966e3e8ae1cf4 thirdparty/openwrt-passwall          git
repo passwall-packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git - 049aaf472e8ce7e423299d43a516b7092a25b381 thirdparty/openwrt-passwall-packages git
repo nikki             https://github.com/nikkinikki-org/OpenWrt-nikki.git               - 78e1a751d55ed0762811f054ee699049473da7b8 thirdparty/OpenWrt-nikki               git
repo openclash         https://github.com/vernesong/OpenClash.git                        - e553e82e01c697aefbe1555261a503f425e00ccd thirdparty/OpenClash                   git
repo poweroffdevice    https://github.com/sirpdboy/luci-app-poweroffdevice.git           - 8f53359c3234c7c398b846b5425f9b0b017c03ec thirdparty/luci-app-poweroffdevice     git
repo bandix-luci       https://github.com/timsaya/luci-app-bandix-plus.git               - c4f002f74f3a0f4aeb79fb5d35f5a7bbd3392a1f thirdparty/luci-app-bandix-plus        git
repo bandix-core       https://github.com/timsaya/openwrt-bandix-plus.git                - fba9704300f2900451e00a1645e11b1f179204b8 thirdparty/openwrt-bandix-plus         git
repo cpu-status        https://github.com/OneNAS-space/luci-app-cpu-status.git           - a6dd8a279b5c9cfe9e77807080b66b75659fe9fb thirdparty/luci-app-cpu-status         git
# wifihistory 取自 openwrt/luci 的 sources/wifihistory 分支，只保留
# applications/luci-app-wifihistory，并把 Makefile 的 include 改成指向本树的
# feeds/luci/luci.mk（因此工作区有 1 处改动，属预期）。稀疏检出 + 补丁不便
# 自动重放，标 manual：脚本只校验 HEAD，不改写。
repo wifihistory       https://github.com/openwrt/luci.git                               - 03c6023b0c7a93ba7d6e13b49e69917d5bce7fb7 thirdparty/luci-wifihistory           manual

# ---------------------------------------------------------------------------
# 链接（sources/thirdparty-feed/<name> → ../<vendor-dir>/<subdir>）
# ---------------------------------------------------------------------------
link luci-app-passwall        passwall   luci-app-passwall
link nikki                    nikki      nikki
link mihomo-meta              nikki      mihomo-meta
link mihomo-alpha             nikki      mihomo-alpha
link luci-app-nikki           nikki      luci-app-nikki
link luci-app-openclash       openclash  luci-app-openclash
link luci-app-poweroffdevice  poweroffdevice luci-app-poweroffdevice
link luci-app-bandix-plus     bandix-luci luci-app-bandix-plus
link luci-app-cpu-status      cpu-status .
link luci-app-wifihistory     wifihistory applications/luci-app-wifihistory

# bandix-plus 后端经过人工重排（去掉上游的多包布局），不是原样引用。
local bandix-plus local-relayout/bandix-plus

# passwall_selected 是 sources/passwall-selected（从 passwall-packages 中挑出的
# 7 个包）在 feeds.conf 里的独立 src-link，不在 thirdparty-feed 下；
# 内容人工剪裁，没有 .git，脚本仅检查目录非空。
#
#   来源：passwall-packages @ 049aaf472e8ce7e423299d43a516b7092a25b381
#   包含：chinadns-ng dns2socks ipt2socks microsocks shadowsocksr-libev
#         simple-obfs tcping
